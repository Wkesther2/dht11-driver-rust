[package]
authors = ["Gabriel Zuser <zusergabriel@gmail.com>"]
name = "dht11-driver-rust"
edition = "2024"
version = "0.1.0"

[lib]
harness = false

[[example]]
name = "stm32f407"
path = "src/examples/stm32f407.rs"

# --- 📦 Dependencies ---

[dependencies]
# Basic HAL and defmt 🦀
defmt = "0.3"
embedded-hal = "1.0.0"

# Optional Cortex-M support for DWT 🏎️
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"], optional = true }

[dev-dependencies]
# We only use the mcu-feature here. 
# The runtime support is handled by the separate cortex-m-rt dependency below.
stm32f4xx-hal = { version = "0.23.0", features = ["stm32f407"] } 
cortex-m-rt = "0.7"
defmt-rtt = "1.1.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
defmt-test = "0.4.0"

# --- 🛠️ Features ---

[features]
default = ["dwt"]
# The "dwt" feature enables the cortex-m dependency ⚡
dwt = ["dep:cortex-m"]

# --- ⚙️ Profiles ---

# cargo build/run (Debug)
[profile.dev]
opt-level = 0
codegen-units = 1
debug = true

# Optimize dependencies even in debug mode to keep timing stable 🏎️
[profile.dev.package."*"]
opt-level = 3

# cargo build/run --release
[profile.release]
opt-level = 3
codegen-units = 1
lto = 'fat'
debug = 2 # Keep debug symbols for defmt